<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kRon card</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; align-items: flex-end; }
  /* Flies in from the right edge like the Windows flyout, and back out when it closes. */
  #card { transform: translateX(64px); opacity: 0; transition: transform 240ms cubic-bezier(0.4, 0, 1, 1), opacity 160ms ease-in; }
  body.shown #card { transform: none; opacity: 1; transition: transform 300ms cubic-bezier(0.1, 0.9, 0.2, 1), opacity 200ms ease-out; }
  #detach { width: 28px; height: 28px; margin: -6px -4px -6px 4px; border-radius: 8px; color: var(--text-2); flex-shrink: 0; }
  #detach:hover { background: var(--hover); color: var(--text); }
  #card {
    width: 100%;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  #glow { position: absolute; left: -60px; top: -80px; width: 220px; height: 180px; border-radius: 50%; background: var(--art); filter: blur(60px); opacity: 0.35; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 12px; position: relative; }
  #art { width: 56px; height: 56px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); }
  #art svg { width: 22px; height: 22px; }
  .meta { flex: 1; min-width: 0; padding-right: 0; display: flex; flex-direction: column; gap: 2px; }
  #title { font-size: 15px; font-weight: 700; }
  #artist { font-size: 12px; color: var(--text-2); }
  .ctl { width: 36px; height: 36px; }
  #play { width: 40px; height: 40px; }
  .controls { display: flex; align-items: center; gap: 2px; }
  .seek { display: flex; align-items: center; gap: 8px; position: relative; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  #seekbar { flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; }
  #seekbar .bar { flex: 1; }
  #lyric { position: relative; font-size: 13px; font-weight: 700; color: var(--hi-ui); line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #lyric:empty { display: none; }
</style>
</head>
<body>
<div id="card">
  <div id="glow" aria-hidden="true"></div>
  <div class="row">
    <div id="art" class="art"></div>
    <div class="meta">
      <span id="title" class="ellipsis">Nothing playing</span>
      <span id="artist" class="ellipsis">Play something in any app</span>
    </div>
    <div class="controls">
      <button id="prev" class="icon-btn ctl" aria-label="Previous track"></button>
      <button id="play" class="play-btn" aria-label="Play"></button>
      <button id="next" class="icon-btn ctl" aria-label="Next track"></button>
    </div>
  </div>
  <div class="seek">
    <span id="pos">0:00</span>
    <div id="seekbar" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"><span id="fill"></span></div></div>
    <span id="dur">0:00</span>
    <button id="detach" aria-label="Put kRon back on the taskbar" title="Put kRon back on the taskbar"></button>
  </div>
  <div id="lyric"></div>
</div>
<script src="common.js"></script>
<script src="dock.js"></script>
</body>
</html>
