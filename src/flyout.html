<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kRon panel</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; align-items: flex-end; }
  #panel {
    width: 100%;
    border-radius: 24px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    padding: 22px 46px 14px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #glow {
    position: absolute; left: -70px; top: -90px; width: 300px; height: 260px; border-radius: 50%;
    background: var(--art); filter: blur(70px); opacity: 0.45; pointer-events: none; transition: background 300ms ease;
  }
  body[data-page="system"] #glow { background: var(--accent); opacity: 0.3; }

  .arrow {
    position: absolute; z-index: 2; top: 50%; margin-top: -22px; width: 30px; height: 44px; border-radius: 12px;
    background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.8); transition: background 120ms ease;
  }
  .arrow:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
  #go-prev { left: 8px; }
  #go-next { right: 8px; }

  .page { display: none; flex-direction: column; gap: 16px; position: relative; }
  body[data-page="music"] #page-music, body[data-page="system"] #page-system { display: flex; }
  .slide-R { animation: slideR 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .slide-L { animation: slideL 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes slideR { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes slideL { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }

  /* Music */
  .head { display: flex; gap: 14px; align-items: center; }
  #art { width: 88px; height: 88px; border-radius: 18px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
  #art svg { width: 28px; height: 28px; }
  .head-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  #title { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
  #sub { font-size: 13px; color: var(--text-2); }
  #source { align-self: flex-start; margin-top: 2px; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.78); }
  #source:empty { display: none; }

  .seek { display: flex; flex-direction: column; gap: 6px; }
  #seekbar { height: 14px; display: flex; align-items: center; cursor: pointer; }
  #seekbar .bar { flex: 1; overflow: visible; }
  #knob { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .controls .small { width: 40px; height: 40px; color: var(--text-2); }
  .controls .mid { width: 44px; height: 44px; }
  .controls .mid svg { width: 20px; height: 20px; }
  #play { width: 52px; height: 52px; }
  #play svg { width: 20px; height: 20px; }
  .controls .on { color: var(--accent); }
  #repeat { position: relative; }
  #repeat[data-mode="track"]::after { content: '1'; position: absolute; right: 6px; bottom: 5px; font-size: 9px; font-weight: 700; }

  .card { border-radius: 16px; background: var(--card); border: 1px solid rgba(255, 255, 255, 0.06); padding: 12px 14px; }
  .lyr-card { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-3); }
  .lyr-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lyr-tools { display: flex; gap: 2px; margin: -4px -6px -4px 0; }
  .tool { width: 28px; height: 28px; border-radius: 7px; color: var(--text-2); }
  .tool:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
  /* Long lines wrap (up to 3 rows) instead of being cut off. */
  .lyr-line {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    text-align: left; white-space: normal; overflow-wrap: anywhere; line-height: 1.35;
    font-size: 13px; color: var(--text-3); min-height: 18px; width: 100%;
  }
  .lyr-line:hover { color: #fff; }
  .lyr-line.cur { font-size: 15px; font-weight: 700; color: var(--accent); }
  #lyr-msg { font-size: 13px; color: var(--text-2); }

  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .text-btn { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); }
  .text-btn:hover { background: rgba(127, 224, 198, 0.26); }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(0, 0, 0, 0.3); }
  .seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .seg button:hover { color: #fff; }
  .seg button[aria-checked="true"] { background: rgba(255, 255, 255, 0.16); color: #fff; }
  .switch { width: 44px; height: 24px; padding: 2px; border-radius: 12px; background: rgba(255, 255, 255, 0.22); justify-content: flex-start; transition: background 150ms ease; }
  .switch span { width: 20px; height: 20px; border-radius: 50%; background: #fff; display: block; transition: transform 150ms ease; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"] span { transform: translateX(20px); }

  /* System */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
  .stat .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--text-2); }
  .stat .top span:last-child { font-size: 11px; color: var(--text-3); }
  .big { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .big small { font-size: 14px; font-weight: 600; }
  #spark { width: 100%; height: 28px; }
  #mem-bar { height: 6px; margin: 11px 0; border-radius: 3px; }
  #mem-bar > span { background: var(--mem); }
  .rate { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rate .d { color: var(--accent); }
  .rate .u { color: var(--up); }
  .soon { border-style: dashed; border-color: rgba(255, 255, 255, 0.2); background: transparent; align-items: center; justify-content: center; text-align: center; color: var(--text-2); font-size: 13px; }
  .soon span { font-size: 11px; color: var(--text-3); }

  .footer { display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; }
  .footer .name { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-3); }
  .dots { display: flex; gap: 5px; }
  .dots span { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.3); display: block; transition: width 200ms ease, background 200ms ease; }
  .dots span.on { width: 18px; background: #fff; }
</style>
</head>
<body data-page="music">
<div id="panel">
  <div id="glow" aria-hidden="true"></div>
  <button id="go-prev" class="arrow" aria-label="Previous panel"></button>
  <button id="go-next" class="arrow" aria-label="Next panel"></button>

  <div id="page-music" class="page" role="group" aria-label="Music">
    <div class="head">
      <div id="art" class="art"></div>
      <div class="head-meta">
        <span id="title" class="ellipsis">Nothing playing</span>
        <span id="sub" class="ellipsis">Play something in Spotify, a browser or any player</span>
        <span id="source"></span>
      </div>
    </div>

    <div class="seek">
      <div id="seekbar" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar"><span id="fill"></span><i id="knob"></i></div>
      </div>
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="controls">
      <button id="shuffle" class="icon-btn small" aria-label="Shuffle" aria-pressed="false"></button>
      <button id="prev" class="icon-btn mid" aria-label="Previous track"></button>
      <button id="play" class="play-btn" aria-label="Play"></button>
      <button id="next" class="icon-btn mid" aria-label="Next track"></button>
      <button id="repeat" class="icon-btn small" aria-label="Repeat"></button>
    </div>

    <div class="card lyr-card">
      <div class="lyr-head">
        <span id="lyr-label" class="label">Lyrics</span>
        <div class="lyr-tools">
          <button id="lyr-search" class="tool" aria-label="Search the web for these lyrics" title="Search the web"></button>
          <button id="lyr-add" class="tool" aria-label="Add or edit lyrics" title="Add / edit lyrics file"></button>
          <button id="lyr-folder" class="tool" aria-label="Open lyrics folder" title="Open lyrics folder"></button>
          <button id="lyr-reload" class="tool" aria-label="Reload lyrics" title="Reload lyrics"></button>
        </div>
      </div>
      <div id="lyr-lines" style="display: flex; flex-direction: column; gap: 6px">
        <button class="lyr-line" data-off="-1"></button>
        <button class="lyr-line cur" data-off="0"></button>
        <button class="lyr-line" data-off="1"></button>
      </div>
      <span id="lyr-msg"></span>
    </div>

    <div class="switch-row">
      <span id="place-label">Lyrics</span>
      <div style="display: flex; align-items: center; gap: 8px">
        <button id="customize" class="text-btn">Customize</button>
        <div class="seg" role="radiogroup" aria-labelledby="place-label">
          <button role="radio" data-place="off">Off</button>
          <button role="radio" data-place="desktop">Desktop</button>
          <button role="radio" data-place="taskbar">Taskbar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="page-system" class="page" role="group" aria-label="System">
    <div class="grid">
      <div class="card stat">
        <div class="top"><span>CPU</span><span id="cores"></span></div>
        <span class="big"><span id="cpu">0</span><small>%</small></span>
        <svg id="spark" viewBox="0 0 140 28" preserveAspectRatio="none" aria-hidden="true"><polyline id="spark-line" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></polyline></svg>
      </div>
      <div class="card stat">
        <div class="top"><span>Memory</span><span id="mem-gb"></span></div>
        <span class="big"><span id="mem">0</span><small>%</small></span>
        <div id="mem-bar" class="bar"><span></span></div>
      </div>
      <div class="card stat">
        <div class="top"><span>Internet</span><span>now</span></div>
        <span class="rate"><span class="d" aria-hidden="true">↓</span> <span id="down">–</span></span>
        <span class="rate"><span class="u" aria-hidden="true">↑</span> <span id="up">–</span></span>
      </div>
      <div class="card stat soon">
        More metrics soon
        <span>GPU · Disk · Battery · Temp</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <span id="page-name" class="name">Now playing</span>
    <div class="dots" aria-hidden="true"><span id="dot-music" class="on"></span><span id="dot-system"></span></div>
  </div>
</div>
<script src="common.js"></script>
<script src="flyout.js"></script>
</body>
</html>
