<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kRon lyrics</title>
<link rel="stylesheet" href="common.css?v=9302cd4986">
<style>
  body { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; }
  #wrap {
    --s: 1;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px dashed transparent;
  }
  body.edit #wrap { border-color: rgba(255, 255, 255, 0.45); background: rgba(10, 12, 18, 0.25); }
  #lines {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: calc(6px * var(--s));
    text-align: right;
    text-shadow: var(--lyr-shadow);
    border-radius: 12px;
    transition: background 150ms ease, padding 150ms ease;
  }
  /* Shown instead of the lyrics when there are none: faint until you point at it, and it opens the search window. */
  #hint {
    display: none; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; white-space: nowrap;
    font-size: calc(14px * var(--s)); color: var(--lyr-text); background: var(--lyr-backdrop); text-shadow: var(--lyr-shadow);
    opacity: 0.45; transition: opacity 150ms ease; cursor: pointer;
  }
  #hint:hover, #hint:focus-visible { opacity: 0.95; outline: 0; }
  #hint b { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  body.hint #hint { display: inline-flex; }
  body.hint #lines { display: none; }
  body.backdrop #lines { background: var(--lyr-backdrop); padding: 10px 14px; text-shadow: none; }
  .side { font-size: calc(17px * var(--s)); font-weight: 500; color: color-mix(in srgb, var(--lyr-text) 72%, transparent); max-width: 100%; }
  .far { font-size: calc(14px * var(--s)); color: color-mix(in srgb, var(--lyr-text) 50%, transparent); }
  /* The line being sung, highlighted as a whole. */
  .cur { font-size: calc(30px * var(--s)); font-weight: 700; line-height: 1.2; letter-spacing: -0.2px; max-width: 100%; color: var(--lyr-hi); }
  .enter { animation: rise 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes rise { from { opacity: 0.2; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  #toolbar {
    color: #ffffff; /* the toolbar is always dark, whatever the theme */
    display: none;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 10px;
    background: rgba(24, 26, 34, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 12px;
    text-shadow: none;
  }
  body.edit #toolbar { display: flex; }
  #toolbar button { height: 32px; min-width: 32px; padding: 0 8px; border-radius: 7px; }
  #toolbar button:hover { background: rgba(255, 255, 255, 0.1); }
  #toolbar button.on { color: var(--accent); background: var(--accent-soft); }
  #grip { cursor: grab; }
  #grip:active { cursor: grabbing; }
  .sep { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.14); margin: 0 4px; }
  #sync { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; color: var(--text-2); }
  #done { background: var(--accent) !important; color: var(--accent-ink); font-weight: 700; }
</style>
</head>
<body>
<div id="wrap">
  <div id="toolbar" role="toolbar" aria-label="Lyrics settings">
    <button id="grip" aria-label="Drag to move" title="Drag to move">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
    </button>
    <span class="sep"></span>
    <button id="smaller" aria-label="Smaller text" title="Smaller text">A−</button>
    <button id="bigger" aria-label="Larger text" title="Larger text" style="font-size: 15px">A+</button>
    <button id="lines-btn" title="Lines shown">3 lines</button>
    <button id="backdrop" aria-label="Frosted backdrop" title="Frosted backdrop" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/></svg>
    </button>
    <span class="sep"></span>
    <button id="later" aria-label="Show lyrics later" title="Lyrics 0.25s later">−</button>
    <span id="sync">Sync 0.00s</span>
    <button id="earlier" aria-label="Show lyrics earlier" title="Lyrics 0.25s earlier">+</button>
    <span class="sep"></span>
    <button id="reset" title="Back to defaults">Reset</button>
    <button id="done">Done</button>
  </div>
  <button id="hint" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
    <span id="hint-text"></span>
    <b>Search</b>
  </button>
  <div id="lines" aria-live="off"></div>
</div>
<script src="shim.js?v=9302cd4986"></script>
<script src="common.js?v=9302cd4986"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const SAMPLE = ['Your lyrics show up here', 'Drag the dots to move them', 'Press Done when it looks right'];
  let lastKey = null;

  function offsets() {
    return K.state.settings.lyr_lines >= 5 ? [-2, -1, 0, 1, 2] : [-1, 0, 1];
  }

  function textAt(i) {
    const lines = K.state.lyrics.lines;
    if (!K.state.overlayEdit || (K.state.lyrics.status === 'synced' && lines.length)) {
      return lines[i] ? K.lineText(i) : '';
    }
    return SAMPLE[i] || ''; // sample lines when there is nothing to sync yet
  }

  function update(force) {
    const s = K.state;
    const lines = s.lyrics.lines;
    const pos = K.position();
    const synced = s.lyrics.status === 'synced' && lines.length > 0;
    let idx = K.lineIndex(pos);
    if (!synced && s.overlayEdit) idx = 1;

    const key = `${idx}|${s.settings.lyr_lines}|${s.overlayEdit}|${s.lyrics.track_key}`;
    if (force || key !== lastKey) {
      const changedLine = lastKey !== null && key.split('|')[0] !== lastKey.split('|')[0];
      lastKey = key;
      const box = $('lines');
      box.innerHTML = '';
      for (const off of offsets()) {
        const el = document.createElement('div');
        const i = idx + off;
        if (off === 0) {
          el.className = 'cur';
          words = (idx >= 0 ? textAt(i) : '').split(/(\s+)/);
          el.innerHTML = words.map((w) => `<span>${K.esc(w)}</span>`).join('');
        } else {
          el.className = Math.abs(off) === 2 ? 'side far' : 'side';
          el.textContent = i >= 0 ? textAt(i) : '';
        }
        box.appendChild(el);
      }
      if (changedLine) {
        box.classList.remove('enter');
        void box.offsetWidth;
        box.classList.add('enter');
      }
    }
  }

  const HINT = { none: 'No lyrics found', plain: 'Only unsynced lyrics found', error: "Couldn't reach the lyrics service" };
  function hintFor(s) {
    const st = s.settings;
    if (s.overlayEdit || !st.lyrics_on || st.lyr_place !== 'desktop' || !s.media.active) return '';
    return HINT[s.lyrics.status] || '';
  }

  function renderChrome(s) {
    const st = s.settings;
    const hint = hintFor(s);
    document.body.classList.toggle('hint', !!hint);
    $('hint-text').textContent = hint ? `${hint} ·` : '';
    document.body.classList.toggle('edit', s.overlayEdit);
    document.body.classList.toggle('backdrop', st.lyr_backdrop);
    $('wrap').style.setProperty('--s', String(st.lyr_scale));
    $('lines-btn').textContent = `${st.lyr_lines} lines`;
    $('backdrop').classList.toggle('on', st.lyr_backdrop);
    $('backdrop').setAttribute('aria-pressed', String(st.lyr_backdrop));
    const o = (st.lyr_offset_ms || 0) / 1000;
    $('sync').textContent = `Sync ${o > 0 ? '+' : ''}${o.toFixed(2)}s`;
  }

  $('hint').onclick = () => K.invoke('lyrics_action', { action: 'search' });

  // The window follows the content; Rust keeps the bottom-right corner in place. It is only narrower than the
  // normal lyrics width while the hint shows, so that clicks next to the hint still reach the apps underneath.
  const FULL_W = 680;
  let lastSize = '';
  const reportSize = () => {
    const r = $('wrap').getBoundingClientRect();
    const hinting = document.body.classList.contains('hint');
    const w = hinting ? Math.ceil(r.width) + 4 : FULL_W;
    const h = Math.ceil(r.height) + 4;
    if (`${w}x${h}` !== lastSize) {
      lastSize = `${w}x${h}`;
      K.invoke('overlay_size', { w, h });
    }
  };
  new ResizeObserver(reportSize).observe($('wrap'));

  const round2 = (v) => Math.round(v * 100) / 100;
  $('smaller').onclick = () => K.setLyr({ scale: round2(Math.max(0.6, K.state.settings.lyr_scale - 0.1)) });
  $('bigger').onclick = () => K.setLyr({ scale: round2(Math.min(2, K.state.settings.lyr_scale + 0.1)) });
  $('lines-btn').onclick = () => K.setLyr({ lines: K.state.settings.lyr_lines >= 5 ? 3 : 5 });
  $('backdrop').onclick = () => K.setLyr({ backdrop: !K.state.settings.lyr_backdrop });
  $('earlier').onclick = () => K.setLyr({ offset_ms: (K.state.settings.lyr_offset_ms || 0) + 250 });
  $('later').onclick = () => K.setLyr({ offset_ms: (K.state.settings.lyr_offset_ms || 0) - 250 });
  $('reset').onclick = () => K.setLyr({ scale: 1, lines: 3, backdrop: false, offset_ms: 0, dx: 0, dy: 0 });
  $('done').onclick = () => K.setOverlayEdit(false);

  // Drag: screen coordinates stay put while the window moves under the cursor.
  let drag = null;
  let pending = null;
  $('grip').addEventListener('pointerdown', (e) => {
    $('grip').setPointerCapture(e.pointerId);
    drag = { x: e.screenX, y: e.screenY, dx: K.state.settings.lyr_dx, dy: K.state.settings.lyr_dy };
  });
  $('grip').addEventListener('pointermove', (e) => {
    if (!drag) return;
    const next = { dx: Math.round(drag.dx + e.screenX - drag.x), dy: Math.round(drag.dy + e.screenY - drag.y) };
    if (!pending) {
      requestAnimationFrame(() => {
        K.setLyr({ ...pending, save: false });
        pending = null;
      });
    }
    pending = next;
  });
  const endDrag = (e) => {
    if (!drag) return;
    drag = null;
    K.setLyr({ dx: K.state.settings.lyr_dx, dy: K.state.settings.lyr_dy });
  };
  $('grip').addEventListener('pointerup', endDrag);
  $('grip').addEventListener('pointercancel', endDrag);

  K.on((s, what) => {
    if (what === 'stats') return;
    renderChrome(s);
    update(true);
  });
  K.init();
  setInterval(() => update(false), 80);
})();
</script>
</body>
</html>
