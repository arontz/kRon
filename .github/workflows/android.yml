name: Android release

# Pushing a tag like android-v0.1.0 builds a signed APK and attaches it to a GitHub pre-release.
# The Windows release workflow only reacts to tags starting with "v", so the two never overlap.
on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the tag matches versionName
        run: |
          expected="${GITHUB_REF_NAME#android-v}"
          actual=$(grep -oP 'val appVersionName = "\K[^"]+' android/app/build.gradle.kts)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersionName $actual in android/app/build.gradle.kts"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kron-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kron-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "kRon-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: kRon Android ${{ github.ref_name }}
          prerelease: true
          files: kRon-${{ github.ref_name }}.apk
