name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and publishes it as a GitHub Release.
# The release notes are the matching "## vX.Y.Z" section of CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $raw = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($raw, "(?ms)^##\s+$([regex]::Escape($tag))[^\r\n]*\r?\n(.*?)(?=^##\s|\z)")
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See the commit history for what changed." }
          $lines = @(
            "## What's new", "",
            $changes, "",
            "## Download", "",
            "**Get kRon_*_x64-setup.exe below**, run it, and kRon appears next to your system tray.", "",
            "Windows 10 or 11. If Windows shows 'Windows protected your PC', click **More info, then Run anyway** (the installer isn't code-signed yet).", "",
            "Then play something in Spotify, a browser or any media app."
          )
          $body = $lines -join "`n"
          $delim = "EOF_" + [guid]::NewGuid().ToString("N")
          "body<<$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delim | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Build only. Publishing happens below, after the (optional) signing step.
      - uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate installer
        id: installer
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          $setup = ($env:ARTIFACT_PATHS | ConvertFrom-Json) | Where-Object { $_ -like '*-setup.exe' } | Select-Object -First 1
          if (-not $setup) { throw "No *-setup.exe in build artifacts: $env:ARTIFACT_PATHS" }
          "path=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Code signing through SignPath (https://signpath.org). Skipped until the SIGNPATH_API_TOKEN secret exists,
      # so tag pushes keep producing a working (unsigned) release in the meantime.
      # Only the installer is signed; the installed kron.exe and the uninstaller are not.
      - name: Check signing is configured
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $on = if ($env:SIGNPATH_API_TOKEN) { 'true' } else { 'false' }
          "enabled=$on" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload unsigned installer
        id: upload
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: ${{ steps.installer.outputs.path }}

      - name: Sign installer (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          # Not secret. Set these as repository variables once the SignPath project exists.
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SETUP_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $signed = Get-ChildItem -Path signed -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no *-setup.exe in 'signed'" }
          Copy-Item $signed.FullName $env:SETUP_PATH -Force
          (Get-AuthenticodeSignature $env:SETUP_PATH).Status

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.body }}
          SETUP_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $NOTES | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $env:TAG $env:SETUP_PATH --title "kRon $env:TAG" --notes-file release-notes.md
