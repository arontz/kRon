name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and publishes it as a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: kRon ${{ github.ref_name }}
          releaseBody: |
            ## Download

            **Get `kRon_*_x64-setup.exe` below**, run it, and kRon appears next to your system tray.

            Windows 10 or 11. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer isn't code-signed yet).

            Then play something in Spotify, a browser or any media app.
          releaseDraft: false
          prerelease: false
